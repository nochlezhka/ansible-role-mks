---
- name: Recursively remove MKS sources directory
  ansible.builtin.file:
    path: /opt/homeless/mks/sources
    state: absent

- name: Create MKS directories if they do not exist
  ansible.builtin.file:
    path: /opt/homeless/{{ item }}
    state: directory
    mode: '0755'
  with_items:
    - "mks"
    - "mks/sources"
    - "mks/deploy"
    - "mks/deploy/storage/mysql_data"
    - "mks/deploy/storage/data"
    - "mks/deploy/storage/data/uploads"

- name: Update  MKS storage/uploads folder permissions
  ansible.builtin.file:
    path: /opt/homeless/mks/deploy/storage/data/uploads
    owner: ubuntu
    state: directory
    mode: '0755'

- name: Clone a github repository
  git:
    repo: https://github.com/nochlezhka/mks.git
    dest: /opt/homeless/mks/sources
    clone: yes
    update: yes
    version: "{{ mks_repo_branch | default(mks_version) }}"

- name: Read application Compose configuration
  ansible.builtin.slurp:
    src: /opt/homeless/mks/sources/deploy/docker-compose.yml
  register: mks_compose_source

- name: Validate Caddy support before replacing Compose configuration
  ansible.builtin.assert:
    that:
      - "'caddy' in (mks_compose_source.content | b64decode | from_yaml).services"
    fail_msg: Select mks_version and mks_repo_branch containing the Caddy deployment from nochlezhka/mks PR 156.

- name: Copy docker-compose file
  vars:
    mks_compose_config: '{{ mks_compose_source.content | b64decode | from_yaml }}'
  ansible.builtin.copy:
    content: >-
      {{ mks_compose_config | combine(
        {'services': {'caddy': {'volumes': mks_compose_config.services.caddy.volumes
          | default([]) | reject('equalto', './storage/data/caddy:/data') | list}}},
        recursive=True) | to_nice_yaml }}
    dest: /opt/homeless/mks/deploy/docker-compose.yml

- name: Copy .env file
  ansible.builtin.template:
    src: env.j2
    dest: "/opt/homeless/mks/deploy/.env"

- name: Copy logo files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/{{ item }}"
    dest: "/opt/homeless/mks/deploy/storage/data/uploads/{{ item }}"
  with_items:
    - "logo.png"
    - "big_logo.png"
  when: set_logo

# Configure
- ansible.builtin.include_tasks: external_disk.yml
- ansible.builtin.include_tasks: install.yml
- ansible.builtin.include_tasks: migrations.yml
